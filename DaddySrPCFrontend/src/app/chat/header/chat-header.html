<header class="chat-header" [class.chat-header--floating]="agentConfig.floatingHeader">

  <!-- Left: menu button (visible en tablet/mobile) -->
  <div class="chat-header__side chat-header__side--left">
    <button
      type="button"
      class="chat-header__menu-btn"
      (click)="toggleSidebar.emit()"
      [attr.aria-label]="sidebarOpen() ? 'Cerrar panel' : 'Abrir panel'"
      [attr.aria-expanded]="sidebarOpen()"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true">
        @if (sidebarOpen()) {
          <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        } @else {
          <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        }
      </svg>
    </button>
  </div>

  <!-- Center: agent identity (avatar + nombre centrados) -->
  <div class="chat-header__agent">
    <div class="chat-header__agent-id">
      <div class="chat-header__avatar" aria-hidden="true">
        <img [src]="agentConfig.logo" alt="" width="32" height="32" />
        <span class="chat-header__status-dot"></span>
      </div>
      <span class="chat-header__agent-name">{{ agentConfig.name | transloco }}</span>
    </div>
    <span class="chat-header__agent-status">{{ agentConfig.statusKey | transloco }}</span>
  </div>

  <!-- Right: contador + GitHub Star -->
  <div class="chat-header__side chat-header__side--right">
    <div
      class="chat-header__counter"
      [class.chat-header__counter--soft]="counter.notice() === 'soft'"
      [class.chat-header__counter--strong]="counter.notice() === 'strong'"
      [class.chat-header__counter--depleted]="counter.depleted()"
      role="status"
      aria-live="polite"
      [attr.aria-label]="'Quedan ' + counter.remaining() + ' de ' + counter.total + ' preguntas gratis'"
    >
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/>
        <path d="M12 7v5l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="chat-header__counter-text mono">
        {{ counter.remaining() }}/{{ counter.total }}
      </span>
    </div>

    <a
      class="chat-header__gh-star"
      href="https://github.com/YerssonDavid/Daddy-Sr.PC-ONE"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="GitHub Star — Daddy Sr.PC"
    >
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      <span class="chat-header__gh-count">{{ ghStars.count() ?? '—' }}</span>
      <span class="chat-header__gh-label">Star</span>
    </a>
    <app-theme-toggle class="chat-header__theme-desktop" />
  </div>

</header>
