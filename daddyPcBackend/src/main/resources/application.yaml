spring:
  application:
    name: daddyPcBackend

  docker:
    compose:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  ai:
    model:
      chat: openai
    openai:
      base-url: https://api.siliconflow.com/v1
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: zai-org/GLM-5.1
          temperature: 0.3
      embedding:
        options:
          model: Qwen/Qwen3-Embedding-0.6B
          dimensions: 768
  output:
    ansi:
      enabled: always
  profiles:
    active: dev

  autoconfigure:
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration

tavily:
  api-key: ${TAVILY_API}